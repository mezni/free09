[alembic]
script_location = migrations
section = sqlalchemy.url
python_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy.engine]
level = INFO
handlers =
propagate = False

[logger_alembic]
level = INFO
handlers =
propagate = True

[logger_alembic.migration]
level = INFO
handlers =
propagate = True

[logger_alembic.env]
level = INFO
handlers =
propagate = True
