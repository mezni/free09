[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-platform"
version = "0.1.0"
description = "Telco platform monorepo — FastAPI services on PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "scikit-learn",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "httpx",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "prometheus-client>=0.21.0",
]

[dependency-groups]
dev = [
    "nox",
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "pip-audit>=2.10.1",
    "mypy>=2.4.0",
    "pyyaml",
    "pre-commit>=4.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".specify",
    "specs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "A", "PT", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    "Depends",
    "Query",
    "Path",
    "Body",
    "Header",
    "Cookie",
    "Form",
    "File",
    "Security",
]

[tool.ruff.lint.per-file-ignores]
"noxfile.py" = ["A001"]

[tool.coverage.run]
branch = true
source = ["src", "libs/telco-common/src"]
omit = [
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.setuptools]
packages = [
    "src",
    "src.api",
    "src.api.endpoints",
    "src.middleware",
    "src.models",
    "src.models.telco",
    "src.router",
    "src.services",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, cross-component)",
    "contract: Contract tests (API surface validation)",
    "governance: Governance-related tests (constitution, ADRs, templates)",
    "database: Tests that require a live PostgreSQL instance",
    "slow: Marks that require significant time or resources",
    "minimal_test_suite_passes_on_empty_implementation: Marker for the always-passing minimal suite",
    "trace: Distributed tracing tests (FR-040)",
    "key: API key management tests (FR-043)",
    "webhook: Webhook validation and delivery tests (FR-044)",
    "health: Health and readiness probe tests (FR-042)",
    "error: Error tracking tests (FR-041)",
    "performance: Performance benchmark tests (FR-046)",
]
testpaths = ["tests"]
python_files = "test_*.py"
