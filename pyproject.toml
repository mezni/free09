[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "telco-platform"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pandas",
    "scikit-learn",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line-length = 88

[tool.flake8]
select = "E,F,W,B"
max-line-length = 88
exclude = ".git,__pycache__,build,dist,*.egg-info"
