
[project]
name = "telco-si"
version = "0.1.0"
description = "Telecom simulation platform for microservices and AI agent engineering"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]

requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
