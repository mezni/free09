[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-platform"
version = "0.1.0"
description = "Telco platform monorepo — FastAPI services on PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "scikit-learn",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "httpx",
]

[dependency-groups]
dev = [
    "nox",
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "pip-audit>=2.10.1",
    "mypy>=2.4.0",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line-length = 88

[tool.flake8]
select = "E,F,W,B"
max-line-length = 88
exclude = ".git,__pycache__,build,dist,*.egg-info"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".specify",
    "specs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "A", "PT", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    "Depends",
    "Query",
    "Path",
    "Body",
    "Header",
    "Cookie",
    "Form",
    "File",
    "Security",
]

[tool.ruff.lint.per-file-ignores]
"noxfile.py" = ["A001"]

[tool.setuptools]
packages = [
    "src",
    "src.api",
    "src.api.endpoints",
    "src.middleware",
    "src.models",
    "src.router",
    "src.services",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, cross-component)",
    "contract: Contract tests (API surface validation)",
    "governance: Governance-related tests (constitution, ADRs, templates)",
    "slow: Marks that require significant time or resources",
    "minimal_test_suite_passes_on_empty_implementation: Marker for the always-passing minimal suite",
]
testpaths = ["tests"]
python_files = "test_*.py"
