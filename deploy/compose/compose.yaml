services:
  postgres:
    image: postgres:16.15-alpine
    container_name: postgres-telco
    environment:
      POSTGRES_DB: telco_db
      POSTGRES_USER: telco_user
      POSTGRES_PASSWORD: PLACEHOLDER_NO_REAL_CREDENTIAL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telco_user -d telco_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      telco-net:
        ipv4_address: 172.20.0.2

  auth-service:
    build: services/auth-service
    container_name: auth-service
    environment:
      DATABASE_URL: postgres://telco_user:PLACEHOLDER_NO_REAL_CREDENTIAL@postgres:5432/telco_db
      SERVICE_NAME: auth-service
      SERVICE_ROLE: least-privilege
    networks:
      telco-net:
        ipv4_address: 172.20.0.3
    depends_on:
      postgres:
        condition: service_healthy

  crm-service:
    build: services/crm-service
    container_name: crm-service
    environment:
      DATABASE_URL: postgres://telco_user:PLACEHOLDER_NO_REAL_CREDENTIAL@postgres:5432/telco_db
      SERVICE_NAME: crm-service
      SERVICE_ROLE: least-privilege
    networks:
      telco-net:
        ipv4_address: 172.20.0.4
    depends_on:
      postgres:
        condition: service_healthy

  billing-service:
    build: services/billing-service
    container_name: billing-service
    environment:
      DATABASE_URL: postgres://telco_user:PLACEHOLDER_NO_REAL_CREDENTIAL@postgres:5432/telco_db
      SERVICE_NAME: billing-service
      SERVICE_ROLE: least-privilege
    networks:
      telco-net:
        ipv4_address: 172.20.0.5
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build: services/inventory-service
    container_name: inventory-service
    environment:
      DATABASE_URL: postgres://telco_user:PLACEHOLDER_NO_REAL_CREDENTIAL@postgres:5432/telco_db
      SERVICE_NAME: inventory-service
      SERVICE_ROLE: least-privilege
    networks:
      telco-net:
        ipv4_address: 172.20.0.6
    depends_on:
      postgres:
        condition: service_healthy

networks:
  telco-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
