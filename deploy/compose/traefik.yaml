# Traefik API gateway with rate limiting

api: {}
log:
  level: ERROR

entryPoints:
  http:
    address: :80
  https:
    address: :443

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedbydefault: false

certificatesResolvers:
  letsencrypt:
    acme:
      email: dev@local
      storage: /letsencrypt.json
      tlsChallenge: {}

routers:
  api-router:
    rule: "HostRegexp(`{host:.+}`)"
    entrypoints: http
    middlewares: rate-limit@docker
    
  api-https:
    rule: "HostRegexp(`{host:.+}`)"
    entrypoints: https
    tls: {certificatesResolvers: {letsencrypt}}
    middlewares: rate-limit@docker

middlewares:
  rate-limit:
    rateLimit:
      average: 100
      burst: 10
      period: "1s"
