global:
  resolve_timeout: 5m

route:
  receiver: team-alerts
  group_by: [alertname, instance, job]
  group_wait: 5m
  group_interval: 1h
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: pagerduty
      continue: true
    - matchers: [team="backend"]
      receiver: team-alerts
    - matchers: [team="platform"]
      receiver: team-alerts
    - matchers: [team="database"]
      receiver: database-alerts

receivers:
  - name: team-alerts
    email_configs:
      - to: team-alerts@example.invalid
        send_resolved: true
    slack_configs:
      - api_url: "http://localhost:9093/slack-placeholder"
        channel: "#team-alerts"
        send_resolved: true
    webhook_configs:
      - url: "http://localhost:9093/alerts"
        send_resolved: true

  - name: database-alerts
    email_configs:
      - to: database-alerts@example.invalid
        send_resolved: true
    slack_configs:
      - api_url: "http://localhost:9093/slack-placeholder"
        channel: "#database-alerts"
        send_resolved: true

  - name: pagerduty
    pagerduty_configs:
      - service_key: "PLACEHOLDER_NO_REAL_CREDENTIAL"
        send_resolved: true
