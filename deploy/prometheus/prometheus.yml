global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8000"]

  - job_name: crm-service
    metrics_path: /metrics
    static_configs:
      - targets: ["crm-service:8000"]

  - job_name: billing-service
    metrics_path: /metrics
    static_configs:
      - targets: ["billing-service:8000"]

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8000"]

  # Istio sidecars expose their own Prometheus metrics on port 15020.
  - job_name: istio-proxies
    metrics_path: /stats/prometheus
    static_configs:
      - targets:
          - auth-service:15020
          - crm-service:15020
          - billing-service:15020
          - notification-service:15020
