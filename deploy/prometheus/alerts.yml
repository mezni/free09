groups:
  - name: telco-service-health
    rules:
      - alert: ServiceErrorRateHigh
        expr: |
          (
            sum by (service) (rate(service_errors_total[5m]))
            /
            sum by (service) (rate(service_requests_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "{{ $labels.service }} error rate is above 1%"
          description: "The five-minute error rate for {{ $labels.service }} exceeds the 1% objective."
          runbook_url: "https://github.com/mezni/telco-si/blob/main/docs/runbooks/service-error-rate.md"

      - alert: ServiceLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service) (rate(service_request_duration_seconds_bucket[5m]))
          ) > 1.5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "{{ $labels.service }} p95 latency is above 1.5s"
          description: "The p95 request latency for {{ $labels.service }} exceeds the 1.5 second objective."
          runbook_url: "https://github.com/mezni/telco-si/blob/main/docs/runbooks/latency-spike.md"

      - alert: ServiceDown
        expr: up{job=~".+-service"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "{{ $labels.job }} is not scrapeable"
          description: "Prometheus cannot scrape {{ $labels.instance }} for more than one minute."
          runbook_url: "https://github.com/mezni/telco-si/blob/main/docs/runbooks/service-error-rate.md"

      - alert: PerformanceAnomalyDetected
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service) (rate(service_request_duration_seconds_bucket[5m]))
          )
          >
          1.5 * avg_over_time(
            (
              histogram_quantile(
                0.95,
                sum by (le, service) (rate(service_request_duration_seconds_bucket[5m]))
              )
            )[1h:5m]
          )
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "{{ $labels.service }} latency deviated from its rolling percentile"
          description: "The five-minute p95 latency is more than 50% above the one-hour rolling baseline."
          runbook_url: "https://github.com/mezni/telco-si/blob/main/docs/runbooks/latency-spike.md"
