# Gitleaks configuration — T048 [P] [US2]
#
# The required `secret-scan` check runs `ci/secret_scan.py`, which needs no
# external binary and works offline. This configuration governs the advisory
# `gitleaks` pre-commit hook and any direct `gitleaks` invocation, so that
# both scanners agree on what a placeholder is.
#
# The repository's own placeholder literals are allowlisted: they are
# documentation of the placeholder convention, not credentials.

title = "telco-platform secret scanning rules"

[extend]
useDefault = true

[allowlist]
description = "The repository's own documented placeholder literals"
paths = [
  '''(^|/)ci/file-coverage\.yml$''',
  '''(^|/)docs/.*\.md$''',
  '''(^|/)specs/.*\.md$''',
  '''(^|/)README\.md$''',
  '''(^|/)CONTRIBUTING\.md$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)ci/setup\.sh$''',
]
regexes = [
  '''PLACEHOLDER_NO_REAL_CREDENTIAL''',
  '''PASSWORD_PLACEHOLDER''',
  '''localdevpassword''',
  '''test-jwt-token''',
]

[[rules]]
description = "Weak literal assigned to a credential-bearing name"
id = "weak-placeholder-literal"
regex = '''(?i)\b(api[_-]?key|secret[_-]?key|password|passwd|token)\s*[:=]\s*["']?[A-Za-z0-9+/=_-]{8,}["']?'''
keywords = [
  "placeholder",
  "changeme",
  "change_me",
  "example",
  "dummy",
  "redacted",
  "your_",
  "xxxx",
]
path = '''(?i)(^|/)\.env\.example$'''
