# mypy configuration — T045 [US2]
#
# The type check is one of the required checks (Art. X.1). Strict mode is on:
# an untyped boundary is a defect, not a convenience.

[mypy]
python_version = 3.13
strict = True
plugins = pydantic.mypy
warn_unreachable = True
show_error_codes = True
pretty = True

[mypy-tests.*]
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
check_untyped_defs = False

[mypy-ci.*]
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
check_untyped_defs = False

[mypy-noxfile]
disallow_untyped_decorators = False
