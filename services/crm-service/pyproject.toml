# crm-service: pyproject.toml

[project]
name = "services/crm-service"
version = "0.1.0"
description = "Customer Relationship Management service for telco platform"

dependencies = [
    "pydantic>=2.0",
    "redis>=5.0",
]
[tool.pytest.ini_options]
markers = [
    "us1: API Contract Layer tests",
    "us2: SDK generation tests",
    "us3: Advanced feature tests",
    "us4: Polish and compliance tests",
    "gateway: API gateway and rate limiting tests",
    "auth: OAuth2.1 authentication tests",
    "sdk: SDK generation and validation tests",
]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = ["--strict-markers"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy.plugin"]

[tool.coverage.run]
source = ["services/crm-service"]
branch = true
