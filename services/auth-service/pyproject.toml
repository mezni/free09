# auth-service: pyproject.toml

[project]
name = "services/auth-service"
version = "0.1.0"
description = "Authentication and authorization service for telco platform"

[project.dependencies]
pydantic >= 2.0
requests >= 2.31

[tool.ruff]
select = ["E", "F", "I", "B", "A", "PTDL", "SIM"]
line-length = 88

[tool.pytest.ini_options]
markers =
    us1: API Contract Layer tests
    us2: SDK generation tests
    us3: Advanced feature tests
    us4: Polish and compliance tests
    gateway: API gateway and rate limiting tests
    auth: OAuth2.1 authentication tests
    sdk: SDK generation and validation tests
testpaths = ["tests"]
python_files = "test_*.py"
override = ["us1", "us2", "us3", "us4", "gateway", "auth", "sdk"]

[tool.mypy]
strict = True
python_version = "3.13"
plugins = ["pydantic.mypy.plugin"]

[tool.coverage.run]
source = ["services/auth-service"]
branch = true
