name: refresh-advisories

# Advisory snapshot refresh — T062 [P] [US2]
#
# This workflow is advisory. It is not part of the required-check set and it
# is not in the merge gate. It refreshes the vendored advisory snapshot and
# opens a pull request; the pull request is reviewed and merged like any
# other change.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: refresh-advisory-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Refresh the vendored advisory snapshot
        run: |
          uv export --no-emit-project --no-hashes --format requirements-txt \
            --output-file /tmp/locked-requirements.txt
          pip-audit --strict --format=json -r /tmp/locked-requirements.txt \
            > /tmp/audit.json || true
          python ci/refresh_advisories.py /tmp/audit.json

      - name: Open a pull request with the refreshed snapshot
        uses: peter-evans/create-pull-request@8867c4aba1b742c39f8d0ba35429c2dfa4b6cb20 # v7.0.1
        with:
          branch: chore/refresh-advisory-snapshot
          title: "chore: refresh the vendored advisory snapshot"
          commit-message: "chore: refresh the vendored advisory snapshot"
          body: |
            Automated refresh of `ci/advisories/python-advisories.json`.

            The snapshot is generated by `pip-audit` over the locked dependency
            set. It is advisory: the required `dependency-audit` check compares
            the locked set against this file offline.
          add-paths: ci/advisories/python-advisories.json
          delete-branch: true
