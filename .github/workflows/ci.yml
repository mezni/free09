name: ci

# The pipeline contract is fixed by
# `specs/001-project-setup/contracts/verification-contract.md`:
#
# * two parallel lanes feed one gate job;
# * the gate runs under `if: always()` and fails unless every lane reports
#   exactly `success`;
# * no path filters — a path-filtered job reports as skipped, and skipped
#   reads as success;
# * no `continue-on-error` anywhere in the gate's `needs:` chain;
# * every action is pinned to a full commit SHA;
# * the workflow token is read-only and never persisted.

on:
  pull_request:
  push:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-checks:
    name: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies
        timeout-minutes: 5
        run: uv sync --frozen

      - name: Formatting
        timeout-minutes: 2
        run: uv run --frozen nox -s format

      - name: Linting
        timeout-minutes: 3
        run: uv run --frozen nox -s lint

      - name: Lockfile
        timeout-minutes: 1
        run: uv run --frozen nox -s lockfile

      - name: Governance
        timeout-minutes: 2
        run: uv run --frozen nox -s governance

      - name: File coverage
        timeout-minutes: 2
        run: uv run --frozen nox -s file-coverage

  slow-checks:
    name: slow-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELECO_ENV: ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: telco
          POSTGRES_PASSWORD: localdevpassword
          POSTGRES_DB: telco_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies
        timeout-minutes: 5
        run: uv sync --frozen

      - name: Type check
        timeout-minutes: 8
        run: uv run --frozen nox -s typecheck

      - name: Test suite
        timeout-minutes: 10
        run: uv run --frozen nox -s test

      - name: Secret scan
        timeout-minutes: 5
        run: uv run --frozen nox -s secret-scan

      - name: Dependency audit
        timeout-minutes: 3
        run: uv run --frozen nox -s dependency-audit

  required-checks:
    name: required-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fast-checks, slow-checks]
    if: always()
    steps:
      - name: Verify that every lane succeeded
        run: |
          if [ "${{ needs.fast-checks.result }}" != "success" ]; then
            echo "fast-checks reported '${{ needs.fast-checks.result }}'"
            exit 1
          fi
          if [ "${{ needs.slow-checks.result }}" != "success" ]; then
            echo "slow-checks reported '${{ needs.slow-checks.result }}'"
            exit 1
          fi
          echo "every required check passed"
